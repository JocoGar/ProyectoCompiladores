<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<title>Tabla de Símbolos</title>
<style>
body { font-family: Arial, sans-serif; margin: 30px; }
h1 { color: #b30000; }
table { border-collapse: collapse; width: 100%; }
th { background-color: #222; color: white; padding: 8px; }
td { border: 1px solid #999; padding: 8px; }
tr:nth-child(even) { background-color: #f2f2f2; }
</style>
</head>
<body>
<h1>Tabla de Símbolos</h1>
<table>
<tr><th>Nombre</th><th>Tipo</th><th>Rol</th><th>Ámbito</th><th>Clase Ámbito</th><th>Nivel</th><th>Línea</th><th>Columna</th><th>Tamaño Arreglo</th><th>Parámetros</th></tr>
</table>
</body>
</html>
