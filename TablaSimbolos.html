<!DOCTYPE html>

<title>Tabla de Símbolos</title>

td { border: 1px solid #999; padding: 8px; }

</style>
</head>
<body>
<h1>Tabla de Símbolos</h1>
<table>
<tr><th>ID</th><th>Nombre</th><th>Evento</th><th>Tipo</th><th>Rol</th><th>Ámbito</th><th>Clase Ámbito</th><th>Nivel</th><th>Línea</th><th>Columna</th><th>Última expresión asignada</th><th>Cantidad de usos</th><th>Tamaño arreglo</th><th>Cantidad parámetros</th><th>Tipos parámetros</th></tr>
</table>
</body>
</html>
